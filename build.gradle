plugins {
    id "java"
    id "base.base-conventions"
    id "base.checkstyle"
    id "base.application-conventions"
}

repositories {
    maven {
        name = "Lenni0451"
        url = "https://maven.lenni0451.net/snapshots"

        content {
            includeGroupByRegex "net\\.lenni0451(\\..+)?"
            includeGroupByRegex "net\\.raphimc(\\..+)?"
        }
    }
}

dependencies {
    includeInJar "net.raphimc:NoteBlockLib:3.3.0"
    includeInJar "net.raphimc:audio-mixer:3.1.0-20260820.180931-1"
    includeInJar "org.jcraft:jorbis:0.0.17"
    includeInJar "javazoom:jlayer:1.0.1"
    includeInJar "de.sciss:jump3r:1.0.5"
    includeInJar "com.formdev:flatlaf:3.7.2"
    includeInJar "net.lenni0451.commons:swing:1.9.2"
    includeInJar "net.raphimc:thingl:0.2.0-20260728.221330-13:java17"
    includeInJar "org.lwjgl:lwjgl:3.4.2"
    includeInJar "org.lwjgl:lwjgl-opengl:3.4.2"
    includeInJar "org.lwjgl:lwjgl-glfw:3.4.2"
    includeInJar "org.lwjgl:lwjgl-freetype:3.4.2"
    includeInJar("org.lwjglx:lwjgl3-awt:0.2.4") {
        exclude group: "org.lwjgl", module: "lwjgl"
        exclude group: "org.lwjgl", module: "lwjgl-opengl"
        exclude group: "org.lwjgl", module: "lwjgl-vulkan"
    }

    ["natives-windows", "natives-windows-arm64", "natives-linux", "natives-linux-arm64", "natives-macos", "natives-macos-arm64"].each {
        includeInJar "org.lwjgl:lwjgl:3.4.2:$it"
        includeInJar "org.lwjgl:lwjgl-opengl:3.4.2:$it"
        includeInJar "org.lwjgl:lwjgl-glfw:3.4.2:$it"
        includeInJar "org.lwjgl:lwjgl-freetype:3.4.2:$it"
    }
}

application {
    mainClass = "net.raphimc.noteblocktool.Main"
}
